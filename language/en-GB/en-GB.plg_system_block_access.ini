PLG_SH_BLOCK_ACCESS_NAME                       = "System - Block Access"
PLG_SH_BLOCK_ACCESS_DESC                       = "This plugin disables the access to specified parts of the Joomla installation, if a configured security key is not provided. <br />Just append the security key as parameter to the URL (e. g. <code>https://myjoomla.tld/<strong>?thisIsMySpecialSecurityKey</strong></code> or <code>https://myjoomla.tld/?key1=value1&key2=value2<strong>&thisIsMySpecialSecurityKey</strong></code>) to be able to enter the secured website part."
PLG_SH_BLOCK_ACCESS_PASSWORD_LABEL             = "Security key"
PLG_SH_BLOCK_ACCESS_PASSWORD_DESC              = "The security key must be provided on the first time the site is loaded (= once per session)."
PLG_SH_BLOCK_ACCESS_PASSWORD_FRONTEND_LABEL    = "Alternative security key for frontend"
PLG_SH_BLOCK_ACCESS_PASSWORD_FRONTEND_DESC     = "If this key is set, the frontend can only be access with this one. This is independent from the selected area (SITE or ALL). The backend is only accessible with the normal security key."
PLG_SH_BLOCK_ACCESS_AREA_TO_BLOCK_LABEL        = "Area to block"
PLG_SH_BLOCK_ACCESS_AREA_TO_BLOCK_DESC         = "<ul><li>Site: Blocks only the frontend</li><li>Administrator: Blocks only the backend</li><li>All: Blocks both the frontend and the backend</li></ul>"
PLG_SH_BLOCK_ACCESS_TYPE_OF_BLOCK_LABEL        = "Type of block"
PLG_SH_BLOCK_ACCESS_TYPE_OF_BLOCK_DESC         = "<ul><li>401 Message: The page contains only a message. Further loading of page content will be aborted.</li><li>Redirect: The visitor will be redirected to the configured address.</li></ul>"
PLG_SH_BLOCK_ACCESS_TYPE_OF_BLOCK_REDIRECT     = "Redirect"
PLG_SH_BLOCK_ACCESS_TYPE_OF_BLOCK_MESSAGE      = "401 Message"
PLG_SH_BLOCK_ACCESS_AREA_TO_BLOCK_OPTION_SITE  = "Site"
PLG_SH_BLOCK_ACCESS_AREA_TO_BLOCK_OPTION_ADMIN = "Administrator"
PLG_SH_BLOCK_ACCESS_AREA_TO_BLOCK_OPTION_ALL   = "All"

PLG_SH_BLOCK_ACCESS_401_MESSAGE_LABEL          = "Message"
PLG_SH_BLOCK_ACCESS_401_MESSAGE_DESC           = "This message is displayed if the security key is not provided"
PLG_SH_BLOCK_ACCESS_401_MESSAGE                = "401 Message"
PLG_SH_BLOCK_ACCESS_REDIRECTURL_LABEL          = "Redirect-URL"
PLG_SH_BLOCK_ACCESS_REDIRECTURL_DESC           = "Address a user is redirected to. This can either be an absolute URL (e. g. <code>http://my-domain.tld/path/to/joomla</code> or a relative URL to Joomla root (e. g. <code>/my/path</code>))<br /><strong>Default</strong>: Joomla root"
PLG_SH_BLOCK_ACCESS_301_REDIRECT               = "Redirect"

PLG_SH_BLOCK_ACCESS_FIELDSET_HARDENING_LABEL   = "Hardening"

PLG_SH_BLOCK_ACCESS_FIELD_BLOCKAPI_LABEL       = "Also block the Web Services API"
PLG_SH_BLOCK_ACCESS_FIELD_BLOCKAPI_DESC        = "Joomla's Web Services API (/api) can authenticate users independently of the frontend/backend login forms (e.g. via HTTP Basic Auth) and is therefore NOT covered by this plugin unless enabled here. Enabling this blocks the entire API for anyone without the security key or an allow-listed IP address. Only enable this if you are not relying on the API for other purposes, or protect it separately."

PLG_SH_BLOCK_ACCESS_FIELD_ALLOWEDIPS_LABEL     = "Always-allowed IP addresses"
PLG_SH_BLOCK_ACCESS_FIELD_ALLOWEDIPS_DESC      = "Optional list of IP addresses or CIDR ranges (one per line, e.g. 203.0.113.4 or 198.51.100.0/24) that bypass this plugin entirely - useful for an office or VPN address. Leave empty to disable."
